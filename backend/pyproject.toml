[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "ebooklib>=0.18",
    "fastapi>=0.128.6",
    "img2pdf>=0.6.3",
    "markdown>=3.6",
    "onnxruntime>=1.22.0",
    "openpyxl>=3.1.5",
    "pdf2docx>=0.5.8",
    "pillow>=10.4.0",
    "pillow-heif>=0.18.0",
    "pydantic[email]>=2.12.5",
    "pymupdf>=1.24.10",
    "python-dotenv>=1.2.1",
    "python-magic>=0.4.27 ; sys_platform != 'win32'",
    "python-magic-bin>=0.4.14 ; sys_platform == 'win32'",
    "python-multipart>=0.0.22",
    "python-pptx>=0.6.23",
    "rembg>=2.0.67",
    "slowapi>=0.1.9",
    "uvicorn[standard]>=0.40.0",
    "weasyprint>=62.3",
]

[project.optional-dependencies]
markdown-extraction = [
    "pymupdf4llm>=0.0.17",
]
